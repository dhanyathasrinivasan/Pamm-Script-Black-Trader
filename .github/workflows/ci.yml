name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q config dashboard test_suite scripts src run_pamm_suite.py
      - name: Offline smoke tests (no credentials, no network)
        run: python -m pytest -q
